<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens</title>
<style>

--http:#6ea0ff;--grpc:#b58cf5;--temporal:#4cc38a;--kafka:#f0993f;--sql:#9aa6b8;--webhook:#f27aa5;--browser:#4cc9de;--test:#e6a64d;--code:#10161f;--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:16px}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;max-width:1500px;margin:0 auto}

h1{font-size:28px;line-height:1.2;margin:0 0 6px}.sub{color:var(--mute);font-size:16px;margin:0 0 12px}
.refs a{margin-right:14px;font-size:13.5px}

.lead{color:var(--mute);margin:0 0 14px;font-size:14px}

.p-http{background:var(--http)}.p-grpc{background:var(--grpc)}.p-temporal{background:var(--temporal)}.p-kafka{background:var(--kafka)}.p-sql{background:var(--sql)}.p-webhook{background:var(--webhook)}.p-browser{background:var(--browser)}.p-test{background:var(--test)}.p-other{background:var(--mute)}

svg .step{cursor:default}svg .step.link{cursor:pointer}svg .step.link:hover .lbl{text-decoration:underline}svg .step .hit{fill:transparent;pointer-events:all}svg .step.link:hover .hit{fill:var(--accent-soft);opacity:.7}

.legend.terms{margin-top:6px}.legend.terms b{color:var(--ink);font-weight:650}.legend i{display:inline-block;width:22px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

.pay .summ{margin:8px 0;color:var(--mute);font-size:14px}

.wt{margin-top:12px}.wt td.n{width:34px}

<body>
<div class="layout">
  <nav id="nav"><div class="brand">lens</div><div id="navlinks"></div><button class="theme" id="theme">Toggle theme</button></nav>
  <main id="main"></main>
</div>
<script>
const D = /*__DATA__*/null;
const P = /*__PAYLOADS__*/{};
const titles = Object.fromEntries((D.payloads || []).map((p) => [p.id, p.title]));

const PROTO = { HTTP: 'http', gRPC: 'grpc', Temporal: 'temporal', Kafka: 'kafka', SQL: 'sql', webhook: 'webhook', Webhook: 'webhook', browser: 'browser', Browser: 'browser', test: 'test', Test: 'test' };

const sections = [];
function sec(id, title, lead, html) {
  if (!html) return;
  sections.push({ id, title });
  const n = sections.length;
  $('#main').insertAdjacentHTML('beforeend', `<section class="sec" id="${id}"><h2><span class="n">${n}</span>${esc(title)}</h2>${lead ? `<p class="lead">${md(lead)}</p>` : ''}${html}</section>`);
}

/* ---------- header ---------- */
function header() {
  const m = D.meta;
  document.title = m.title + ' · lens';
  const refs = (m.refs || []).map((r) => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>`).join('');
  $('#main').insertAdjacentHTML('beforeend', `<header class="top"><div class="badges"><span class="badge">${esc(m.kind)}</span>${(m.tags || []).map((t) => `<span class="badge mute">${esc(t)}</span>`).join('')}<span class="badge mute">${esc(m.date)}</span></div>
  <h1>${esc(m.title)}</h1><p class="sub">${md(m.subtitle || '')}</p><div class="refs">${refs}</div></header>`);
}

/* ---------- tldr + model ---------- */
function tldr() {
  if (!D.tldr) return;
  sec('tldr', 'TL;DR', '', `<div class="card tldr">${D.model ? `<p class="model">${md(D.model)}</p>` : ''}<ul>${D.tldr.map((x) => `<li>${md(x)}</li>`).join('')}</ul></div>`);
}

/* ---------- participants + component map ---------- */
function participants() {
  if (!D.participants) return;
  const cards = D.participants.map((p) => `<div class="card part"><h3>${esc(p.name)} <span class="badge mute">${esc(p.kind || 'service')}</span></h3><p>${md(p.role || '')}</p>
    ${p.local ? `<div class="kv"><b>Ran as:</b> ${md(p.local)}</div>` : ''}${p.owns ? `<div class="kv"><b>Owns:</b> ${md(p.owns)}</div>` : ''}${p.repo ? `<div class="kv"><b>Repo:</b> <code>${esc(p.repo)}</code></div>` : ''}</div>`).join('');
  const detail = D.participants.some((p) => p.role || p.owns || p.repo || p.local);
  sec('participants', 'Components', D.participantsLead || 'The pieces the change or flow touches. Dashed lines are inferred, solid lines are backed by the code or a capture.', `${map()}${detail ? `<div class="grid g2" style="margin-top:14px">${cards}</div>` : ''}`);
}
function wrapName(s, max) {
  if (s.length <= max) return [s];
  const w = s.split(' '); let best = null;
  for (let i = 1; i < w.length; i++) { const a = w.slice(0, i).join(' '), b = w.slice(i).join(' '); const m = Math.max(a.length, b.length); if (!best || m < best.m) best = { m, l: [a, b] }; }
  return best ? best.l : [s];
}
function nameText(cx, cy, s, max, size) {
  const L = wrapName(s, max), lh = size + 2, y0 = cy - ((L.length - 1) * lh) / 2;
  return `<text x="${cx}" y="${y0 + size * 0.36}" text-anchor="middle" font-size="${size}" font-weight="700">${L.map((l, i) => `<tspan x="${cx}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('')}</text>`;

/* Layered left-to-right layout from edges alone: returns grid cells (x = rank, y = row) and waypoints for edges that skip a column or run backwards. */
function autoPos(ids, edges, opt) {
  const have = new Set(ids);
  const E = edges.map((e, i) => ({ f: e.from, t: e.to, i })).filter((e) => have.has(e.f) && have.has(e.t) && e.f !== e.t);
  const out = Object.fromEntries(ids.map((id) => [id, []])); E.forEach((e) => out[e.f].push(e));
  const st = {}, back = new Set();
  const dfs = (u) => { st[u] = 1; out[u].forEach((e) => { if (st[e.t] === 1) back.add(e.i); else if (!st[e.t]) dfs(e.t); }); st[u] = 2; };
  const hasIn = new Set(E.map((e) => e.t));
  ids.filter((id) => !hasIn.has(id)).forEach((id) => { if (!st[id]) dfs(id); });
  ids.forEach((id) => { if (!st[id]) dfs(id); });
  const dag = E.filter((e) => !back.has(e.i));
  const rank = Object.fromEntries(ids.map((id) => [id, 0]));
  for (let k = 0; k < ids.length; k++) { let ch = false; dag.forEach((e) => { if (rank[e.t] < rank[e.f] + 1) { rank[e.t] = rank[e.f] + 1; ch = true; } }); if (!ch) break; }
  const R = Math.max(0, ...Object.values(rank));
  const cols = Array.from({ length: R + 1 }, () => []); ids.forEach((id) => cols[rank[id]].push(id));
  const ord = {}; const reindex = () => cols.forEach((c) => c.forEach((id, i) => { ord[id] = i; })); reindex();
  const sweep = (r, nbrs) => { const key = {}; cols[r].forEach((id) => { const v = nbrs(id).map((n) => ord[n]); key[id] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : ord[id]; }); cols[r].sort((a, b) => key[a] - key[b]); reindex(); };
  for (let it = 0; it < 4; it++) {
    for (let r = 1; r <= R; r++) sweep(r, (id) => dag.filter((e) => e.t === id).map((e) => e.f));
    for (let r = R - 1; r >= 0; r--) sweep(r, (id) => dag.filter((e) => e.f === id).map((e) => e.t));

  const pos = {}; cols.forEach((c, r) => c.forEach((id, i) => { pos[id] = { x: r, y: i + (rows - c.length) / 2 }; }));
  const via = {}; let topN = 0, botN = 0;
  E.forEach((e) => {
    const a = pos[e.f], b = pos[e.t], isBack = back.has(e.i);
    if (!isBack && Math.abs(a.x - b.x) <= 1) return;
    const top = (a.y + b.y) / 2 <= (rows - 1) / 2;
    const lane = top ? -(g.l0 + g.ls * topN++) : rows - 1 + g.l0 + g.ls * botN++;

  if (dir === 'TB') { Object.values(pos).forEach((p) => { [p.x, p.y] = [p.y, p.x]; }); Object.values(via).forEach((v) => v.forEach((q) => { [q[0], q[1]] = [q[1], q[0]]; })); }
  return { pos, via, dir, g };
}

function edgeLabel(text, mx, my, col) {
  const L = wrapN(text, 22, 3), lh = 12.5, h = L.length * lh + 6, w = Math.max(38, Math.max(...L.map((l) => l.length)) * 6.1 + 14), y0 = my - h / 2;
  return `<rect class="elabel" x="${mx - w / 2}" y="${y0}" width="${w}" height="${h}" rx="6" fill="var(--panel)" stroke="${col}" stroke-opacity=".55"><title>${esc(text)}</title></rect><text x="${mx}" y="${y0 + 13}" text-anchor="middle" font-size="10.5">${L.map((l, i) => `<tspan x="${mx}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('')}</text>`;

function map() {
  const auto = true;
  const geom = (dir) => (dir === 'TB' ? { GX: 330, GY: 150, w: 44 / 150, l0: 115 / 330, ls: 40 / 330 } : { GX: 330, GY: 110, w: 170 / 330, l0: 52 / 110, ls: 34 / 110 });

  (D.edges || []).forEach((e, ei) => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b || e.from === e.to) return;
    const via = viaOf(e, ei);
    const raw = [cen(a), ...via.map(cell), cen(b)];
    const g = grp[[e.from, e.to].sort().join('|')];
    if (g.length > 1 && !via.length) {
      const [p, q] = [e.from, e.to].sort().map((id) => cen(pos[id])), dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1, off = (g.indexOf(ei) - (g.length - 1) / 2) * 16;
      [0, raw.length - 1].forEach((k) => { raw[k] = { x: raw[k].x - (dy / L) * off, y: raw[k].y + (dx / L) * off }; });
    }
    const pts = raw.slice();
    pts[0] = clip(raw[0], raw[1]); pts[pts.length - 1] = clip(raw[raw.length - 1], raw[raw.length - 2]);
    const d = pts.map((q, i) => `${i ? 'L' : 'M'}${q.x},${q.y}`).join(' ');
    lines += `<path d="${d}" fill="none" stroke="${pcol(e.proto)}" stroke-width="1.8" ${e.dashed ? 'stroke-dasharray="5 4"' : ''} marker-end="url(#ar-${PROTO[e.proto] ? e.proto : 'HTTP'})"/>`;
    if (e.label) {
      let best = 0, bi = 0; for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y); if (l > best) { best = l; bi = i; } }
      labels += edgeLabel(e.label, (pts[bi].x + pts[bi + 1].x) / 2, (pts[bi].y + pts[bi + 1].y) / 2, pcol(e.proto));
    }
  });
  let boxes = '';
  nodes.forEach((n) => {

  });

  const svg = `<svg viewBox="0 0 ${vw} ${vh}" style="${auto ? `width:100%;max-width:${Math.round(vw)}px;min-width:${Math.round(vw * 0.8)}px` : 'width:100%;min-width:760px'};height:auto;display:block;margin:0 auto">${defs}${lines}${boxes}${labels}</svg>`;
  const used = [...new Set((D.edges || []).map((e) => e.proto).filter(Boolean))];
  const kc = { test: 'var(--test)', external: 'var(--mute)', service: 'var(--accent)', store: 'var(--sql)', queue: 'var(--kafka)' };

  return `<div class="svgwrap" style="padding:8px">${svg}</div><div class="legend">${used.map((k) => `<span><i style="border-color:${pcol(k)}"></i>${esc(k)}</span>`).join('')}</div><div class="legend">${kinds}</div>`;
}

function termsLegend() {

/* ---------- sequence ---------- */
function sequence() {
  const s = D.sequence; if (!s) return;

  (s.phases || []).forEach((ph, i) => {

    } else {
      const xa = x(st.from), xb = x(st.to), dir = xb > xa ? 1 : -1, mid = (xa + xb) / 2;
      inner = `<line x1="${xa}" y1="${y + 6}" x2="${xb - dir * 2}" y2="${y + 6}" stroke="${col}" stroke-width="1.8" ${kind === 'return' ? 'stroke-dasharray="5 4"' : kind === 'async' ? 'stroke-dasharray="2 3"' : ''} marker-end="url(#sq-${kind})"/><text class="lbl" x="${mid}" y="${y - 2}" text-anchor="middle" font-size="11.5">${esc(st.label)}</text>`;

  sec('sequence', 'How the pieces talk, in order', s.lead || '', `<div class="svgwrap">${svg}</div>${legend}${termsLegend()}${notes}`);
}

/* ---------- payloads ---------- */
function pp(root, rootPath, ind0, lines, ann) {
  const lead = (key, a) => (key === null ? '' : `<span class="k">"${esc(key)}"</span>${a ? `<span class="b">${a.i}</span>` : ''}: `);
  const walk = (v, key, comma, path, ind) => {
    const pad = '  '.repeat(ind), a = ann[path];
    const t = (txt) => `<span class="ln${a ? ' an' : ''}">${pad}${txt}${a && key === null ? `<span class="b">${a.i}</span>` : ''}</span>`;
    if (v === null) { lines.push(t(`${lead(key, a)}<span class="nl">null</span>${comma}`)); return; }
    if (Array.isArray(v)) {
      if (!v.length) { lines.push(t(`${lead(key, a)}[]${comma}`)); return; }
      lines.push(t(`${lead(key, a)}[`));
      v.forEach((it, i) => walk(it, null, i < v.length - 1 ? ',' : '', `${path}[${i}]`, ind + 1));
      lines.push(`<span class="ln">${pad}]${comma}</span>`); return;
    }
    if (typeof v === 'object') {
      const ks = Object.keys(v);
      if (!ks.length) { lines.push(t(`${lead(key, a)}{}${comma}`)); return; }
      lines.push(t(`${lead(key, a)}{`));
      ks.forEach((k, i) => walk(v[k], k, i < ks.length - 1 ? ',' : '', path ? `${path}.${k}` : k, ind + 1));
      lines.push(`<span class="ln">${pad}}${comma}</span>`); return;
    }
    lines.push(t(`${lead(key, a)}<span class="${typeof v === 'string' ? 's' : 'nu'}">${esc(JSON.stringify(v))}</span>${comma}`));
  };
  walk(root, null, '', rootPath, ind0);
}
function bodyHtml(label, v, anns, prefix) {
  if (v === null || v === undefined || v === '') return `<div class="body"><h5>${label}</h5><div class="empty">no body</div></div>`;
  const ann = {}; anns.forEach((a) => { if (a.path.startsWith(prefix + '.')) ann[a.path.slice(prefix.length + 1)] = a; else if (a.path.startsWith(prefix + '[')) ann[a.path.slice(prefix.length)] = a; });
  const lines = []; if (typeof v === 'string') lines.push(`<span class="ln">${esc(v)}</span>`); else pp(v, '', 0, lines, ann);
  return `<div class="body"><h5>${label}</h5><pre class="json">${lines.join('')}</pre></div>`;
}
function payloads() {
  const L = D.payloads; if (!L || !L.length) return;
  const cards = L.map((p) => {
    const data = P[p.id] || {};
    const anns = (p.annotations || []).map((a, i) => ({ ...a, i: i + 1 }));

    return `<details class="card pay" id="pay-${esc(p.id)}"><summary>${pill(proto)}<span class="ttl">${esc(p.title)}</span><span class="mono" style="font-size:12.5px;color:var(--mute)">${esc(data.method || '')} ${esc(data.route || '')}</span><span class="when">${esc((data.when || '').slice(11, 23))}</span></summary>
    <p class="summ">${md(p.summary || '')}</p><div class="bodies">${bodyHtml('Request', data.request, anns, 'request')}${bodyHtml('Response', data.response, anns, 'response')}</div>
    ${anns.length ? `<ol class="ann">${anns.map((a) => `<li><span class="b">${a.i}</span><span><code>${esc(a.path)}</code> ${md(a.note)}</span></li>`).join('')}</ol>` : ''}</details>`;
  }).join('');

/* ---------- ladder / takeaways / evidence ---------- */
function ladder() {

  sec('ladder', 'How it breaks (and how to tell)', 'How it fails and how each failure shows up. Use it as a triage checklist.', `<div class="card"><table><tr><th>Symptom</th><th>Cause</th><th>Fix</th></tr>${D.ladder.map((l) => `<tr><td>${md(l.symptom)}</td><td>${md(l.cause)}</td><td>${md(l.fix)}</td></tr>`).join('')}</table></div>`);

function wrapN(s, max, maxLines) {
  const lines = []; let cur = '';
  String(s).split(/\s+/).forEach((w) => { if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; });
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/.{0,2}$/, '…'); }
  return lines;
}

function flowSvg(F, mid) {
  const W = 190, H = 58, M = 24;
  const geom = (dir) => (dir === 'TB' ? { GX: 310, GY: 140, w: 58 / 140, l0: 125 / 310, ls: 40 / 310 } : { GX: 310, GY: 100, w: 190 / 310, l0: 59 / 100, ls: 34 / 100 });
  const ap = autoPos(F.nodes.map((n) => n.id), F.edges || [], { maxCols: 4, geom });
  const GX = ap.g.GX, GY = ap.g.GY;
  const nodes = F.nodes.map((n) => ({ ...n, ...ap.pos[n.id] }));
  const pos = {}; nodes.forEach((n) => { pos[n.id] = { x: M + n.x * GX, y: M + n.y * GY, n }; });
  const viaOf = (i) => ap.via[i] || [];
  const allVia = (F.edges || []).flatMap((e, i) => viaOf(i));
  const maxX = Math.max(...nodes.map((n) => n.x), ...allVia.map((v) => v[0])), maxY = Math.max(...nodes.map((n) => n.y), ...allVia.map((v) => v[1]));
  const vw = M * 2 + maxX * GX + W, vh = M * 2 + maxY * GY + H;
  const cen = (p) => ({ x: p.x + W / 2, y: p.y + H / 2 });
  const cell = ([gx, gy]) => ({ x: M + gx * GX + W / 2, y: M + gy * GY + H / 2 });
  const clip = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y; const sx = dx ? (W / 2 + 6) / Math.abs(dx) : 1e9, sy = dy ? (H / 2 + 6) / Math.abs(dy) : 1e9; const t = Math.min(sx, sy); return { x: a.x + dx * t, y: a.y + dy * t }; };
  let lines = '', labels = '';
  (F.edges || []).forEach((e, i) => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b || e.from === e.to) return;
    const raw = [cen(a), ...viaOf(i).map(cell), cen(b)], pts = raw.slice();
    pts[0] = clip(raw[0], raw[1]); pts[pts.length - 1] = clip(raw[raw.length - 1], raw[raw.length - 2]);
    lines += `<path d="${pts.map((q, k) => `${k ? 'L' : 'M'}${q.x},${q.y}`).join(' ')}" fill="none" stroke="var(--mute)" stroke-width="1.7" ${e.dashed ? 'stroke-dasharray="5 4"' : ''} marker-end="url(#fl-${mid})"/>`;
    if (e.label) {
      let best = 0, bi = 0; for (let k = 0; k < pts.length - 1; k++) { const l = Math.hypot(pts[k + 1].x - pts[k].x, pts[k + 1].y - pts[k].y); if (l > best) { best = l; bi = k; } }
      labels += edgeLabel(e.label, (pts[bi].x + pts[bi + 1].x) / 2, (pts[bi].y + pts[bi + 1].y) / 2, 'var(--mute)');
    }
  });
  let boxes = '';
  nodes.forEach((n) => {
    const p = pos[n.id], k = n.kind || 'step';
    const stroke = n.changed ? 'var(--warn)' : k === 'decision' ? 'var(--kafka)' : k === 'store' ? 'var(--sql)' : k === 'start' || k === 'end' ? 'var(--mute)' : 'var(--accent)', fill = n.changed ? 'var(--warn-soft)' : 'var(--panel)';
    const shape = k === 'decision'
      ? `<polygon class="nbox" points="${p.x + 18},${p.y} ${p.x + W - 18},${p.y} ${p.x + W},${p.y + H / 2} ${p.x + W - 18},${p.y + H} ${p.x + 18},${p.y + H} ${p.x},${p.y + H / 2}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`
      : `<rect class="nbox" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="${k === 'start' || k === 'end' ? H / 2 : 10}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    const L = wrapN(n.label, k === 'decision' ? 20 : 24, 3), lh = 14, y0 = p.y + H / 2 - ((L.length - 1) * lh) / 2 + 4;
    const idx = numOf(F.nodes, n.id) - 1;
    const badge = numbered(n) ? `<circle cx="${p.x + 4}" cy="${p.y + 4}" r="10" fill="var(--accent)"/><text x="${p.x + 4}" y="${p.y + 8}" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">${idx + 1}</text>` : '';
    boxes += `<g><title>${esc(n.note || n.label)}</title>${shape}${badge}<text x="${p.x + W / 2}" y="${y0}" text-anchor="middle" font-size="12" font-weight="600">${L.map((l, i) => `<tspan x="${p.x + W / 2}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('')}</text></g>`;
  });
  const defs = `<defs><marker id="fl-${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker></defs>`;
  const chip = (c, t, r = 4, bg = 'transparent') => `<span style="border:2px solid ${c};background:${bg};border-radius:${r}px;padding:0 6px">${t}</span>`;
  const kinds = new Set(F.nodes.map((n) => n.kind || 'step'));
  const key = [F.nodes.some((n) => n.changed) ? chip('var(--warn)', 'changed in this change', 4, 'var(--warn-soft)') : '', kinds.has('decision') ? chip('var(--kafka)', 'decision') : '', kinds.has('step') || kinds.has('state') ? chip('var(--accent)', kinds.has('state') ? 'state' : 'step') : '', kinds.has('store') ? chip('var(--sql)', 'store') : '', kinds.has('start') || kinds.has('end') ? chip('var(--mute)', 'start / end', 99) : '', F.nodes.some(numbered) ? '<span><span class="nb" style="min-width:16px;height:16px;line-height:16px;font-size:10px">1</span> numbered steps are explained below</span>' : ''].join('');
  return `<div class="svgwrap" style="padding:8px"><svg viewBox="0 0 ${vw} ${vh}" style="width:100%;max-width:${Math.round(vw)}px;min-width:${Math.round(vw * 0.8)}px;height:auto;display:block;margin:0 auto">${defs}${lines}${boxes}${labels}</svg></div><div class="legend">${key}</div>`;
}

const mutedS = 'font-size:12px;color:var(--mute)';
function touchRow(r) {
  const where = r.where ? (r.where.url ? `<a href="${esc(r.where.url)}" target="_blank" rel="noopener"><code>${esc(r.where.label)}</code></a>` : `<code>${esc(r.where.label)}</code>`) : '';
  return `<tr><td>${esc(r.service || '')}</td><td>${pill(r.channel)}${r.direction ? ` <span style="${mutedS}">${esc(r.direction)}</span>` : ''}${r.target ? `<div class="mono" style="${mutedS}">${esc(r.target)}</div>` : ''}</td><td>${where}${r.text ? `<div class="mono" style="${mutedS};word-break:break-all">${esc(r.text)}${r.removed ? ' (removed)' : ''}</div>` : ''}</td><td>${md(r.note || '')}</td></tr>`;
}
const touchTable = (rows) => `<table class="tp"><colgroup><col style="width:15%"><col style="width:17%"><col style="width:38%"><col style="width:30%"></colgroup><tr><th>Service</th><th>Channel</th><th>Where in the code</th><th>What it does</th></tr>${rows.map(touchRow).join('')}</table>`;

const whereLink = (w) => (w ? (w.url ? `<a href="${esc(w.url)}" target="_blank" rel="noopener"><code>${esc(w.label)}</code></a>` : `<code>${esc(w.label)}</code>`) : '');
const numbered = (n) => !!(n.note || n.where);
const numOf = (nodes, id) => { let k = 0; for (const n of nodes) { if (numbered(n)) k++; if (n.id === id) return numbered(n) ? k : 0; } return 0; };
function walk(nodes) {
  const rows = nodes.filter(numbered).map((n) => ({ n, i: numOf(nodes, n.id) - 1 }));
  if (!rows.length) return '';
  return `<div class="card wt"><table><tr><th></th><th>Step</th><th>What happens</th><th>Where in the code</th></tr>${rows.map(({ n, i }) => `<tr><td class="n"><span class="nb">${i + 1}</span></td><td>${esc(n.label)}</td><td>${md(n.note || '')}</td><td>${whereLink(n.where)}</td></tr>`).join('')}</table></div>`;
}

/* ---------- flow and lifecycle diagrams ---------- */
function flowSec() {
  const F = D.flow; if (!F) return;
  sec('flow', F.title || 'How it works', F.lead, flowSvg(F, 'flow') + walk(F.nodes));
}
function statesSec() {
  const S = D.states; if (!S) return;
  sec('states', S.title || 'Lifecycle', S.lead, flowSvg({ ...S, nodes: S.nodes.map((n) => ({ kind: 'state', ...n })) }, 'states') + walk(S.nodes));
}

/* ---------- problem, code, after ---------- */
function problem() {
  const p = D.problem; if (!p) return;
  let h = '';
  if (p.keyPoints) h += `<div class="card"><ul style="margin:0;padding-left:20px">${p.keyPoints.map((x) => `<li>${md(x)}</li>`).join('')}</ul></div>`;
  if (p.before || p.after) h += `<div class="cols" style="margin-top:12px"><div class="col before"><h4>Before</h4>${md(p.before || '')}</div><div class="col after"><h4>After</h4>${md(p.after || '')}</div></div>`;
  sec('problem', D.meta.kind === 'flow' ? 'What it is for' : 'Problem and approach', p.lead, h);
}
function codeSec() {
  const t = D.touchpoints || {};
  let h = '';
  if (t.rows && t.rows.length) h += `<div class="card">${touchTable(t.rows)}</div>`;
  if (t.more && t.more.length) h += `<details class="card" style="margin-top:12px"><summary style="cursor:pointer">${t.more.length} more hit(s) found by the scan (not discussed above)</summary><div style="margin-top:8px">${touchTable(t.more)}</div></details>`;
  sec('code', 'Where it happens in the code', t.lead, h);
}
function afterShip() {
  const a = D.after || {}, sig = D.signalsAuto || []; if (!D.after && !sig.length) return;
  let h = '';
  if (a.watch && a.watch.length) h += `<div class="card"><table><tr><th>Signal</th><th>Why it matters</th></tr>${a.watch.map((w) => `<tr><td>${md(w.signal)}</td><td>${md(w.why || '')}</td></tr>`).join('')}</table></div>`;
  if (sig.length) h += `<details class="card" style="margin-top:12px"><summary style="cursor:pointer">${sig.length} signal(s) found in the code (metrics, logs, errors, flags, timeouts)</summary><table style="margin-top:8px"><tr><th>Kind</th><th>Name</th><th>Where in the code</th></tr>${sig.map((s) => `<tr><td>${esc(s.kind)}</td><td><code>${esc(s.name || '')}</code></td><td>${whereLink(s.where)}</td></tr>`).join('')}</table></details>`;
  sec('after', D.meta.kind === 'flow' ? 'What to watch' : 'After shipping', a.lead || 'What to look at to know it behaves.', h);
}

/* ---------- boot ---------- */
header(); tldr(); problem(); participants(); flowSec(); sequence(); statesSec(); codeSec(); state(); decisions(); ladder(); takeaways(); payloads(); afterShip(); evidence();
document.title = D.meta.title + ' · lens';
$('#main').insertAdjacentHTML('beforeend', `<footer>Generated by the lens skill · ${esc(D.meta.date)} · the evidence table says what was read, run or inferred; nothing was sent anywhere.</footer>`);
$('#navlinks').innerHTML = sections.map((s) => `<a href="#${s.id}">${esc(s.title)}</a>`).join('');
const links = [...document.querySelectorAll('#navlinks a')];
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { links.forEach((l) => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id)); } }), { rootMargin: '-20% 0px -70% 0px' });
document.querySelectorAll('section.sec').forEach((s) => io.observe(s));
const root = document.documentElement;
root.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; };
</script>
